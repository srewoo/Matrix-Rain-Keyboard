<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 220px;
        margin: 0;
        padding: 18px;
        font-family: monospace;
        background: #000;
        color: #00ff41;
        text-align: center;
      }
      h1 {
        font-size: 15px;
        letter-spacing: 2px;
        margin: 0 0 14px;
        text-shadow: 0 0 6px #00ff41;
      }
      button {
        width: 100%;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #000;
        background: #00ff41;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-shadow: none;
        transition: background 0.15s;
      }
      button.off {
        background: #003b10;
        color: #00ff41;
        box-shadow: inset 0 0 0 1px #00ff41;
      }
      p {
        font-size: 11px;
        opacity: 0.7;
        margin: 12px 0 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>MATRIX RAIN</h1>
    <button id="toggle" class="off">ENABLE</button>
    <p>Then start typing on the page — every keystroke feeds the rain.</p>
    <script src="popup.js"></script>
  </body>
</html>
