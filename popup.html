<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Digital Rain</title>
    <style>
      :root { --g: #00ff41; --dim: #0b3d1a; --bg: #000; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        width: 280px; margin: 0; padding: 16px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        background: var(--bg); color: var(--g);
      }
      h1 { font-size: 15px; letter-spacing: 3px; margin: 0 0 12px; text-shadow: 0 0 6px var(--g); }
      button {
        width: 100%; padding: 10px; font: inherit; font-size: 14px; font-weight: 700;
        letter-spacing: 1px; color: #000; background: var(--g);
        border: 0; border-radius: 4px; cursor: pointer;
      }
      button[aria-pressed="false"] { background: var(--dim); color: var(--g); box-shadow: inset 0 0 0 1px var(--g); }
      :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      fieldset { border: 1px solid var(--dim); border-radius: 4px; margin: 12px 0 0; padding: 8px 10px 4px; }
      legend { padding: 0 4px; opacity: 0.8; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
      .row output { min-width: 3ch; text-align: right; }
      input[type="range"] { width: 100%; accent-color: var(--g); }
      input[type="checkbox"] { accent-color: var(--g); width: 16px; height: 16px; }
      select { width: 100%; font: inherit; background: #000; color: var(--g); border: 1px solid var(--g); border-radius: 4px; padding: 4px; }
      .slider label { display: flex; justify-content: space-between; }
      .slider { margin: 0 0 8px; }
      #status { margin: 10px 0 0; min-height: 1.4em; opacity: 0.8; }
      #status.warn { color: #ffb000; opacity: 1; }
    </style>
  </head>
  <body>
    <h1>DIGITAL RAIN</h1>
    <button id="toggle" aria-pressed="false">ENABLE</button>
    <p id="status" role="status"></p>

    <fieldset>
      <legend>Look</legend>
      <div class="slider">
        <label for="theme">Theme</label>
        <select id="theme"></select>
      </div>
      <div class="slider">
        <label for="density">Density <output for="density" id="density-out"></output></label>
        <input id="density" type="range" step="1" />
      </div>
      <div class="slider">
        <label for="speed">Speed <output for="speed" id="speed-out"></output></label>
        <input id="speed" type="range" step="0.1" />
      </div>
      <div class="slider">
        <label for="glyphSize">Glyph size <output for="glyphSize" id="glyphSize-out"></output></label>
        <input id="glyphSize" type="range" step="1" />
      </div>
      <div class="slider">
        <label for="backdrop">Page dimming <output for="backdrop" id="backdrop-out"></output></label>
        <input id="backdrop" type="range" step="0.05" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Behaviour</legend>
      <div class="row">
        <label for="typedGlyphs">Show typed characters</label>
        <input id="typedGlyphs" type="checkbox" />
      </div>
      <div class="row">
        <label for="enterBurst">Enter key bursts the screen</label>
        <input id="enterBurst" type="checkbox" />
      </div>
      <div class="row" id="site-row" hidden>
        <label for="siteOn">Run on <span id="site-name"></span></label>
        <input id="siteOn" type="checkbox" />
      </div>
    </fieldset>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
